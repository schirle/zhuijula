<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="浏览器插件下载与安装教程：在豆瓣电影页面一键「找资源」，直达本站播放源。">
    <title></title>
    <meta name="theme-color" content="#0f0f17">
    <link rel="icon" href="file/zhuiju.png">
    <link rel="stylesheet" href="file/common.css">
    <link rel="stylesheet" href="file/index.css">
    <link rel="stylesheet" href="file/plugin.css">
    <link rel="stylesheet" href="file/fontawesome/css/all.min.css">
    <script>
(function(){try{var t=localStorage.getItem('ftv_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
    <link rel="preconnect" href="https://gimg0.baidu.com" crossorigin>
    <script defer src="file/wechat-tip.js"></script>
    <script defer src="file/common.js"></script>
</head>
<body data-page="plugin">

    <nav class="top-nav" id="top-nav"></nav>

    <main class="plugin-main">

        <section class="plugin-hero">
            <div class="plugin-hero-ico"><i class="fas fa-puzzle-piece"></i></div>
            <h1 class="plugin-hero-title" id="plugin-hero-title">浏览器插件</h1>
            <p class="plugin-hero-desc">在豆瓣电影页面一键「找资源」，直达本站播放源，省去手动复制片名。</p>
            <div class="plugin-actions">
                <button class="btn-install" data-crx onclick="installExtension()"><i class="fas fa-download"></i> 下载 Chrome 扩展</button>
                <button class="btn-ghost" onclick="installUserScript()"><i class="fas fa-wand-magic-sparkles"></i> 安装油猴脚本</button>
            </div>
        </section>

        <section class="plugin-section" id="sec-plugin-steps" style="display:none">
            <div class="section-header"><span class="section-title"><i class="fas fa-list-ol"></i> 安装步骤</span></div>
            <ol class="step-list" id="plugin-steps"></ol>
        </section>

        <section class="plugin-section" id="sec-plugin-feats" style="display:none">
            <div class="section-header"><span class="section-title"><i class="fas fa-star"></i> 功能亮点</span></div>
            <div class="feat-grid" id="plugin-feats"></div>
        </section>

        <section class="plugin-section" id="sec-plugin-faq" style="display:none">
            <div class="section-header"><span class="section-title"><i class="fas fa-circle-question"></i> 常见问题</span></div>
            <div class="faq-list" id="plugin-faq"></div>
        </section>

        <footer class="footer" data-site-footer>仅供学习交流使用</footer>
    </main>

    <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部"><i class="fas fa-arrow-up"></i></button>
</body>
</html>
