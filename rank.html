<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <meta name="description" content="搜索排行榜 - 全站用户真实搜索热词实时榜单">
    <title></title>
    <link rel="icon" href="file/zhuiju.png">
    <meta name="theme-color" content="#0f0f17">
    <link rel="stylesheet" href="file/common.css">
    <link rel="stylesheet" href="file/fontawesome/css/all.min.css">
    <script>
      (function () { try { var t = localStorage.getItem('ftv_theme'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
    </script>
    <script defer src="file/common.js"></script>
    <link rel="stylesheet" href="file/rank.css">
</head>
<body data-page="rank" data-search-nav="1">
    <nav class="top-nav" id="top-nav"></nav>

    <main class="main-container">
        <section class="rank-head">
            <h1 class="rank-page-title"><i class="fas fa-fire"></i> 搜索排行榜</h1>
            <p class="rank-page-sub">实时聚合全站用户的真实搜索热词，点击词条即可直达搜索结果</p>
            <div class="rank-stats" id="rank-stats"></div>
            <div class="rank-tabs" id="rank-tabs">
                <button type="button" class="rank-tab active" data-range="day">日榜</button>
                <button type="button" class="rank-tab" data-range="week">周榜</button>
                <button type="button" class="rank-tab" data-range="month">月榜</button>
            </div>
        </section>

        <section class="rank-podium" id="rank-podium" style="display:none"></section>

        <div class="rank-layout" id="rank-layout">
            <div class="rank-box">
                <div class="rank-box-head">
                    <span class="rbh-title"><i class="fas fa-ranking-star"></i> 完整榜单</span>
                    <span class="rbh-note" id="rank-note"></span>
                </div>
                <ol class="rank-list" id="rank-list">
                    <li class="rank-loading"><i class="fas fa-spinner fa-spin"></i> 加载中…</li>
                </ol>
            </div>

            <div class="rank-box rank-cloud-box" id="rank-cloud-box" style="display:none">
                <div class="rank-box-head">
                    <span class="rbh-title"><i class="fas fa-cloud"></i> 热词云</span>
                    <span class="rbh-note">字号越大，搜的人越多</span>
                </div>
                <div class="rank-cloud" id="rank-cloud"></div>
            </div>

            <p class="rank-foot">榜单每 2 分钟更新一次 · 只统计真实访客的搜索，异常刷量已被过滤</p>
        </div>

        <div class="footer" data-site-footer>免费追剧 · 全网影视免费在线观看</div>
    </main>

    <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部"><i class="fas fa-arrow-up"></i></button>
    <script defer src="file/rank.js"></script>
</body>
</html>
