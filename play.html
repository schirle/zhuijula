<body data-page="play">
    <div class="page-loading" id="page-loading">
        <div class="spinner"></div>
        <span class="page-loading-text">正在加载影片数据...</span>
    </div>

    <nav class="top-nav" id="top-nav"></nav>

    <div id="error-view" class="error-overlay">
        <p id="error-msg">加载失败</p>
        <button class="retry-btn" id="retry-btn">重试</button>
    </div>

    <div class="page-wrapper" id="app" style="display:none">
        <section class="video-section" id="video-section">
            <div class="now-ep-label" id="now-ep-label"></div>
            <div class="video-container">
                <div id="mse"></div>
                <div class="player-loading hidden" id="player-loading">
                    <div class="spinner"></div>
                    <span class="player-loading-text">加载播放器中...</span>
                </div>
                <div class="player-tools" id="player-tools">
                    <button class="pt-btn" id="speed-btn" type="button" aria-label="倍速">倍速 <span id="speed-val">1.0x</span></button>
                    <div class="speed-menu" id="speed-menu" hidden>
                        <button type="button" data-rate="0.5">0.5x</button>
                        <button type="button" data-rate="0.75">0.75x</button>
                        <button type="button" data-rate="1" class="active">1.0x</button>
                        <button type="button" data-rate="1.25">1.25x</button>
                        <button type="button" data-rate="1.5">1.5x</button>
                        <button type="button" data-rate="2">2.0x</button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="sidebar" id="sidebar">
            <div class="now-playing">
                <div class="np-poster"><img id="np-poster" src="" alt="海报" loading="lazy"></div>
                <div class="np-text">
                    <h1 class="np-title" id="np-title"></h1>
                    <div class="np-meta" id="np-meta"></div>
                    <div class="np-actions">
                        <button class="np-act" id="np-share" type="button"><i class="fas fa-share-nodes"></i>分享</button>
                    </div>
                </div>
            </div>

            <div class="ad-container ad-slot" id="ad-container"></div>

            <div class="side-tabs" id="side-tabs">
                <button class="side-tab active" data-tab="episodes">选集</button>
                <button class="side-tab" data-tab="intro">简介</button>
                <button class="side-tab" data-tab="related">相关</button>
            </div>

            <div class="tab-panel active" id="tab-episodes">
                <div class="source-row" id="source-tabs"></div>
                <div class="ep-toolbar">
                    <span class="ep-count" id="ep-count"></span>
                    <div class="ep-sort" id="ep-sort">
                        <button class="sort-btn active" data-order="asc">正序</button>
                        <button class="sort-btn" data-order="desc">倒序</button>
                    </div>
                </div>
                <div class="episodes-wrapper"><div id="episode-list" class="episodes-grid"></div></div>
            </div>

            <div class="tab-panel" id="tab-intro">
                <div id="desc-section" class="intro-box" style="display:none">
                    <p id="vod-description" class="desc-content collapsed"></p>
                    <button id="desc-toggle-btn" class="desc-toggle">展开 ▾</button>
                </div>
                <dl class="intro-meta" id="intro-meta"></dl>
            </div>

            <div class="tab-panel" id="tab-related">
                <div class="rec-grid" id="related-list"></div>
            </div>
        </aside>

        <aside class="content" id="content">
            <p class="play-tip">不要相信视频中的广告</p>

            <div class="title-row">
                <h1 class="vod-title" id="vod-title"></h1>
                <a class="desc-trigger" id="desc-trigger" href="javascript:void(0)" role="button">简介 <i class="fas fa-chevron-right"></i></a>
            </div>
            <p class="vod-desc" id="vod-desc"></p>

            <div class="action-row" id="action-row">
                <button class="act-btn" id="act-prev" type="button" aria-label="上一集"><i class="fas fa-chevron-left"></i><span>上一集</span></button>
                <button class="act-btn" id="act-share" type="button" aria-label="分享"><i class="fas fa-share-nodes"></i><span>分享</span></button>
                <button class="act-btn" id="act-dl" type="button" aria-label="下载"><i class="fas fa-download"></i><span>下载</span></button>
                <button class="act-btn" id="act-refresh" type="button" aria-label="刷新"><i class="fas fa-arrows-rotate"></i><span>刷新</span></button>
                <button class="act-btn" id="act-next" type="button" aria-label="下一集"><i class="fas fa-chevron-right"></i><span>下一集</span></button>
            </div>

            <div class="ep-block">
                <div class="ep-block-head">
                    <span class="block-label">选集</span>
                    <span class="ep-playing" id="ep-playing-label"></span>
                    <button class="ep-open-all" id="ep-open-all" type="button"><span id="ep-count-text">全0集</span> <i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="ep-one-row" id="ep-one-row"></div>
            </div>

            <div class="ad-block ad-slot" id="ad-block"></div>

            <div class="rec-block">
                <div class="block-label">猜你喜欢</div>
                <div class="rec-grid" id="rec-list"></div>
            </div>

            <div class="rec-block" id="ai-relate-block" style="display:none">
                <div class="block-label"><i class="fas fa-wand-magic-sparkles"></i> AI 相关搜索</div>
                <div class="ai-relate-chips" id="ai-relate"></div>
            </div>
        </aside>
    </div>

    <div class="sheet" id="detail-sheet" aria-hidden="true">
        <div class="sheet-mask" data-close></div>
        <div class="sheet-panel">
            <button class="sheet-close" type="button" data-close aria-label="关闭"><i class="fas fa-times"></i></button>

                <img class="detail-poster" id="sheet-poster" src="" alt="">

                    <h3 class="detail-title" id="sheet-title"></h3>
                    <p class="detail-meta" id="sheet-meta"></p>
                </div>

            <dl class="detail-cast" id="sheet-cast"></dl>
            <h4 class="detail-section-title">简介</h4>
            <p class="detail-desc" id="sheet-desc"></p>
        </div>
    </div>

    <div class="sheet" id="ep-sheet" aria-hidden="true">
        <div class="sheet-mask" data-close></div>
        <div class="sheet-panel sheet-lg">
            <button class="sheet-close" type="button" data-close aria-label="关闭"><i class="fas fa-times"></i></button>

            <div class="sheet-ep-grid" id="sheet-ep-list"></div>

                <div class="qr-loading" id="qr-loading">生成二维码中...</div>
