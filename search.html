<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">

    <link rel="stylesheet" href="/file/common.css">
    <link rel="stylesheet" href="file/fontawesome/css/all.min.css">
    <script>
      (function () { try { var t = localStorage.getItem('ftv_theme'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
    </script>
    <link rel="preconnect" href="https://gimg0.baidu.com" crossorigin>

</head>
<body data-page="search" data-search-nav="1">
    <nav class="top-nav" id="top-nav"></nav>

    <main class="main-container">
        <section class="s-hero">
            <form class="s-box" id="s-form" autocomplete="off">
                <i class="fas fa-search s-ico"></i>
                <input type="text" id="s-input" placeholder="搜索..." autocomplete="off">
                <button type="button" class="s-clear" id="s-clear" aria-label="清除">✕</button>
                <button type="submit" class="s-btn">搜索</button>
            </form>
            <div class="s-tabs" id="s-tabs">
                <button type="button" class="s-tab active" data-tab="all">影视</button>
                <button type="button" class="s-tab" data-tab="wp">网盘</button>
            </div>
        </section>

        <div class="s-layout">
            <div class="s-main">
                <div id="result-area">
                    <div class="s-guide">
                        <div class="s-guide-icon"><i class="fas fa-clapperboard"></i></div>

                    </div>
                </div>
                <div id="wp-area" style="display:none"></div>
            </div>

            <aside class="s-side">
                <div class="side-box" id="side-today-box">
                    <div class="side-title"><i class="fas fa-calendar-day"></i> 今日推荐</div>
                    <div class="side-today" id="side-today"></div>
                </div>
                <div class="side-box" id="side-app-box">
                    <div class="side-title"><i class="fas fa-download"></i> APP下载</div>
                    <div class="side-plugin" id="side-app">
                        <p class="side-plugin-desc">安卓/苹果用户都在用的免费追剧APP</p>
                        <a class="sp-btn" href="/app"><i class="fas fa-download"></i> 获取应用</a>
                    </div>
                </div>
                <div class="side-box" id="side-plugin-box">
                    <div class="side-title"><i class="fas fa-puzzle-piece"></i> 追剧插件</div>
                    <div class="side-plugin" id="side-plugin">
                        <p class="side-plugin-desc">在豆瓣电影页面一键「找资源」，快速查找免费影视资源。</p>
                        <a class="sp-btn" href="/plugin"><i class="fas fa-download"></i> 获取插件</a>
                    </div>
                </div>
                <div class="side-box" id="side-hot-box">
                    <div class="side-title">
                        <span class="side-title-main"><i class="fas fa-fire"></i> 搜索排行</span>
                        <div class="side-rank-tabs" id="side-rank-tabs">
                            <button type="button" class="srt active" data-range="day">日榜</button>
                            <button type="button" class="srt" data-range="week">周榜</button>
                            <button type="button" class="srt" data-range="month">月榜</button>
                        </div>
                    </div>
                    <ol class="side-rank" id="side-hot"></ol>
                    <a class="side-rank-more" id="side-rank-more" href="/rank">查看更多搜索排行<i class="fas fa-angle-right"></i></a>
                </div>
            </aside>
        </div>

        <div class="footer" data-site-footer>免费追剧 · 全网影视免费在线观看</div>
    </main>

    <script defer src="/file/search.js"></script>
    <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部"><i class="fas fa-arrow-up"></i></button>
</body>
</html>
